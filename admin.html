function e(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function d(t){return t?new Date(t).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}):""}
function go(){if(!window.tprCallFn){document.getElementById("msg").innerHTML="<p>Sign-in is not available.</p>";return}
tprCallFn("admin-sales",{},function(r){var m=document.getElementById("msg");
if(r.error==="signin"){m.innerHTML='<p>Please <a href="account.html">sign in</a> with your admin account.</p>';return}
if(r.error){m.innerHTML="<p>Not available: "+e(r.error)+". Your account needs the admin role (Netlify, Identity, your user, Roles: admin), then sign out and in.</p>";return}
var tot=0,last7=0,now=Date.now();r.sales.forEach(function(s){tot+=s.amount;if(now-s.when<7*864e5)last7++});
var paid=r.users.filter(function(u){return Object.keys(u.plans).length}).length;
m.innerHTML='<h2>Overview <small style="font:13px Helvetica Neue,Arial;color:#B8932C">Stripe: '+e(r.mode)+'</small></h2><div class="sumg"><div><b>'+r.users.length+'</b>registered</div><div><b>'+paid+'</b>paying members</div><div><b>'+r.sales.length+'</b>sales (last 100)</div><div><b>£'+tot.toFixed(0)+'</b>revenue shown</div></div><p>'+last7+' sales in the last 7 days. Refunds and full detail: <a href="https://dashboard.stripe.com/payments" target="_blank">Stripe dashboard</a>. To give access by hand: Netlify, Identity, the user, add a role.</p>';
document.getElementById("out").innerHTML='<div class="panel"><h2>Recent payments</h2><table class="t"><tr><th>When</th><th>Email</th><th>Course plan</th><th>Amount</th></tr>'+r.sales.map(function(s){return "<tr><td>"+d(s.when)+"</td><td>"+e(s.email)+"</td><td>"+e(s.plan)+" ("+e(s.role)+")</td><td>"+e(s.currency)+" "+s.amount.toFixed(2)+"</td></tr>"}).join("")+'</table></div><div class="panel"><h2>Members</h2><table class="t"><tr><th>Email</th><th>Joined</th><th>Email confirmed</th><th>Courses and end dates</th></tr>'+r.users.sort(function(a,b){return a.joined<b.joined?1:-1}).map(function(u){return "<tr><td>"+e(u.email)+"</td><td>"+d(u.joined)+"</td><td>"+(u.confirmed?"Yes":"<b>No</b>")+"</td><td>"+(Object.keys(u.plans).map(function(k){return e(k)+" until "+d(u.plans[k]).split(",")[0]}).join("<br>")||e(u.roles.join(", "))||"none")+"</td></tr>"}).join("")+"</table></div>"})}
if(typeof onAuthReady==="function")onAuthReady(go);else go();</script><script src="content/coursenav.js?v=4"></script></body></html>
