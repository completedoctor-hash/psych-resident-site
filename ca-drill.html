<style>
body{margin:0;font:17px/1.6 Georgia,serif}
.mast{color:#fff}.mast .in{max-width:1200px;margin:0 auto;padding:16px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}

.mast nav{margin-left:auto;display:flex;gap:18px}.mast nav a{color:#fff;text-decoration:none;font:700 12px Helvetica Neue,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;min-height:80vh}
.side{padding:0}.side h2{font:700 20px "Playfair Display",Georgia,serif;margin:0;padding:18px}

.side button{background:#fff;border:0;border-bottom:1px solid #EEF0F3;border-left:3px solid transparent;color:#14243A}.side button:hover,.side button.on{border-left-color:#B8932C;background:#F7F8FA}
.side button small{color:#B8932C;font-weight:700}
.stage{padding:26px 30px}.top{display:flex;justify-content:space-between;align-items:baseline;font:12px Helvetica Neue,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#5B6474}

<header class="mast"><div class="in"><a class="brand" href="index.html">The Psychiatric Resident<span>Critical Appraisal · Calculation drill</span></a>
<nav><a href="critical-appraisal.html">The course</a><a href="ca-flashcards.html">Flashcards</a><a href="ca-practice.html">Practice</a><a href="formulas.html">Formulas</a><a href="paper-b.html">Paper B</a></nav></div></header>
<div class="shell"><aside class="side"><h2>Calculations</h2><div class="list" id="list"></div></aside>
<main class="stage"><div class="top"><span id="where">All calculations · mixed</span><span class="score" id="score">0 / 0</span></div>
<h1 id="title">&nbsp;</h1><div class="card"><p class="q" id="q"></p>
<div class="row"><input id="ans" inputmode="decimal" placeholder="Your answer" autocomplete="off"><button class="btn gold" id="check">Check</button><button class="btn" id="next">New numbers →</button></div>
<div class="res" id="res"></div></div>
<p style="font:12px Helvetica Neue,Arial,sans-serif;color:#5B6474">Enter checks · N new numbers · every card is fresh each time. Percentages can be typed as 25 or 0.25.</p></main></div>
<script>
var R=function(a,b,s){s=s||1;return Math.round((a+Math.random()*(b-a))/s)*s},f=function(x,d){return +x.toFixed(d==null?2:d)};
var G=[
["NNT","NNT",function(){var c=R(20,50),e=R(5,c-5);var arr=(c-e)/100,n=Math.ceil(1/arr-1e-9);return{q:"In an RCT of an antidepressant, relapse occurred in "+c+"% of the placebo group and "+e+"% of the treatment group. What is the NNT?",a:n,tol:0,f:["ARR = CER − EER","NNT = 1 ÷ ARR (round UP)"],p:"How many people you treat for one extra person to avoid relapse.",w:["CER = "+c+"% = "+(c/100),"EER = "+e+"% = "+(e/100),"ARR = "+(c/100)+" − "+(e/100)+" = "+f(arr,2),"NNT = 1 ÷ "+f(arr,2)+" = "+f(1/arr,2)+" → "+n]}}],
["NNH","NNH",function(){var c=R(2,10),e=R(c+3,c+20);var ari=(e-c)/100,n=Math.ceil(1/ari-1e-9);return{q:"Weight gain over 7% occurred in "+e+"% on olanzapine and "+c+"% on placebo. What is the NNH?",a:n,tol:0,f:["ARI = EER − CER","NNH = 1 ÷ ARI (round UP)"],p:"How many you treat before one extra person is harmed.",w:["ARI = "+(e/100)+" − "+(c/100)+" = "+f(ari,2),"NNH = 1 ÷ "+f(ari,2)+" = "+f(1/ari,2)+" → "+n]}}],
["RR & RRR","RRR (%)",function(){var c=R(30,60),e=R(10,c-5);var rr=e/c;return{q:"Self-harm repetition was "+c+"% with usual care and "+e+"% with the new intervention. What is the relative risk reduction (%)?",a:f((1-rr)*100,1),tol:1,f:["RR = EER ÷ CER","RRR = 1 − RR = (CER − EER) ÷ CER"],p:"The reduction as a share of the control group's risk.",w:["RR = "+(e/100)+" ÷ "+(c/100)+" = "+f(rr,3),"RRR = 1 − "+f(rr,3)+" = "+f(1-rr,3)+" = "+f((1-rr)*100,1)+"%"]}}],
["Odds ratio","OR",function(){var a=R(20,60),b=R(40,120),c=R(10,40),d=R(60,150);return{q:"Case-control study of cannabis and psychosis. Cases: "+a+" exposed, "+c+" unexposed. Controls: "+b+" exposed, "+d+" unexposed. What is the odds ratio?",a:f(a*d/(b*c),2),tol:.05,f:["OR = (a × d) ÷ (b × c)","a = exposed cases, b = exposed controls, c = unexposed cases, d = unexposed controls"],p:"Odds of exposure in cases compared with controls.",w:["a×d = "+a+"×"+d+" = "+a*d,"b×c = "+b+"×"+c+" = "+b*c,"OR = "+a*d+" ÷ "+b*c+" = "+f(a*d/(b*c),2)]}}],
["Sensitivity","Sensitivity (%)",function(){var tp=R(40,90),fn=R(5,30),fp=R(5,40),tn=R(80,200);return{q:"A depression screening tool: TP "+tp+", FN "+fn+", FP "+fp+", TN "+tn+". What is the sensitivity (%)?",a:f(tp/(tp+fn)*100,1),tol:1,f:["Sensitivity = TP ÷ (TP + FN)"],p:"Of everyone WITH depression, the share the test picks up.",w:["TP + FN = "+(tp+fn),"Sensitivity = "+tp+" ÷ "+(tp+fn)+" = "+f(tp/(tp+fn)*100,1)+"%"]}}],
["Specificity","Specificity (%)",function(){var tp=R(40,90),fn=R(5,30),fp=R(5,40),tn=R(80,200);return{q:"A dementia screening test: TP "+tp+", FN "+fn+", FP "+fp+", TN "+tn+". What is the specificity (%)?",a:f(tn/(tn+fp)*100,1),tol:1,f:["Specificity = TN ÷ (TN + FP)"],p:"Of everyone WITHOUT dementia, the share the test correctly clears.",w:["TN + FP = "+(tn+fp),"Specificity = "+tn+" ÷ "+(tn+fp)+" = "+f(tn/(tn+fp)*100,1)+"%"]}}],
["PPV from prevalence","PPV (%)",function(){var se=R(70,95),sp=R(80,98),pr=R(2,30),N=1000,d=N*pr/100,tp=d*se/100,fp=(N-d)*(1-sp/100);var v=tp/(tp+fp)*100;return{q:"A test has sensitivity "+se+"% and specificity "+sp+"%. Prevalence is "+pr+"%. What is the PPV (%)? (Imagine 1,000 people.)",a:f(v,1),tol:1.5,f:["PPV = TP ÷ (TP + FP)","Build the 2×2 from 1,000 people first"],p:"If the test is positive, the chance it is truly positive. Low prevalence → low PPV.",w:["With disease = "+f(d,1)+", without = "+f(N-d,1),"TP = "+f(d,1)+" × "+(se/100)+" = "+f(tp,1),"FP = "+f(N-d,1)+" × "+f(1-sp/100,2)+" = "+f(fp,1),"PPV = "+f(tp,1)+" ÷ "+f(tp+fp,1)+" = "+f(v,1)+"%"]}}],
["NPV from prevalence","NPV (%)",function(){var se=R(70,95),sp=R(80,98),pr=R(5,40),N=1000,d=N*pr/100,fn=d*(1-se/100),tn=(N-d)*sp/100;var v=tn/(tn+fn)*100;return{q:"Sensitivity "+se+"%, specificity "+sp+"%, prevalence "+pr+"%. What is the NPV (%)? (Imagine 1,000 people.)",a:f(v,1),tol:1,f:["NPV = TN ÷ (TN + FN)"],p:"If the test is negative, the chance the person is truly well.",w:["With disease = "+f(d,1)+", without = "+f(N-d,1),"FN = "+f(d,1)+" × "+f(1-se/100,2)+" = "+f(fn,1),"TN = "+f(N-d,1)+" × "+(sp/100)+" = "+f(tn,1),"NPV = "+f(tn,1)+" ÷ "+f(tn+fn,1)+" = "+f(v,1)+"%"]}}],
["LR+","LR+",function(){var se=R(60,95),sp=R(70,97);return{q:"A rating scale for PTSD has sensitivity "+se+"% and specificity "+sp+"%. What is the positive likelihood ratio?",a:f(se/(100-sp),2),tol:.05,f:["LR+ = Sensitivity ÷ (1 − Specificity)"],p:"How much a positive result raises the odds. Above 10 = strong.",w:["1 − Specificity = 1 − "+(sp/100)+" = "+f(1-sp/100,2),"LR+ = "+(se/100)+" ÷ "+f(1-sp/100,2)+" = "+f(se/(100-sp),2)]}}],
["LR−","LR−",function(){var se=R(60,95),sp=R(70,97);return{q:"A cognitive screen has sensitivity "+se+"% and specificity "+sp+"%. What is the negative likelihood ratio?",a:f((100-se)/sp,2),tol:.02,f:["LR− = (1 − Sensitivity) ÷ Specificity"],p:"How much a negative result lowers the odds. Below 0.1 = strong.",w:["1 − Sensitivity = "+f(1-se/100,2),"LR− = "+f(1-se/100,2)+" ÷ "+(sp/100)+" = "+f((100-se)/sp,2)]}}],
["Post-test probability","Post-test probability (%)",function(){var p=R(5,40),lr=R(2,20);var o=p/(100-p),po=o*lr,pp=po/(1+po)*100;return{q:"Pre-test probability of bipolar disorder is "+p+"%. A positive screen has LR+ of "+lr+". What is the post-test probability (%)?",a:f(pp,1),tol:1.5,f:["Pre-test odds = p ÷ (1 − p)","Post-test odds = pre-test odds × LR","Post-test p = odds ÷ (1 + odds)"],p:"Turn probability into odds, multiply by the LR, turn it back.",w:["Pre-test odds = "+(p/100)+" ÷ "+f(1-p/100,2)+" = "+f(o,3),"Post-test odds = "+f(o,3)+" × "+lr+" = "+f(po,3),"Post-test p = "+f(po,3)+" ÷ "+f(1+po,3)+" = "+f(pp,1)+"%"]}}],
["SEM","SEM",function(){var sd=R(4,20),n=[16,25,36,49,64,81,100,144][R(0,7)];return{q:"Mean HAM-D score in "+n+" patients, SD "+sd+". What is the standard error of the mean?",a:f(sd/Math.sqrt(n),2),tol:.02,f:["SEM = SD ÷ √n"],p:"How precise the sample mean is. Bigger sample → smaller SEM.",w:["√"+n+" = "+Math.sqrt(n),"SEM = "+sd+" ÷ "+Math.sqrt(n)+" = "+f(sd/Math.sqrt(n),2)]}}],
["95% CI","Upper limit",function(){var m=R(10,40),sd=R(4,16),n=[16,25,36,49,64,100][R(0,5)];var se=sd/Math.sqrt(n),u=m+1.96*se;return{q:"Mean PANSS reduction "+m+", SD "+sd+", n = "+n+". What is the UPPER limit of the 95% confidence interval?",a:f(u,2),tol:.05,f:["SEM = SD ÷ √n","95% CI = mean ± 1.96 × SEM"],p:"The range the true mean probably lies in.",w:["SEM = "+sd+" ÷ "+Math.sqrt(n)+" = "+f(se,3),"1.96 × "+f(se,3)+" = "+f(1.96*se,2),"Upper = "+m+" + "+f(1.96*se,2)+" = "+f(u,2)+" (lower = "+f(m-1.96*se,2)+")"]}}],
["SD from variance","SD",function(){var s=R(3,15);return{q:"The variance of MoCA scores is "+s*s+". What is the standard deviation?",a:s,tol:0,f:["SD = √Variance"],p:"Variance is SD squared, so take the square root.",w:["SD = √"+s*s+" = "+s]}}],
["z-score","z",function(){var m=R(90,110),sd=[10,15][R(0,1)],x=m+sd*R(-2,2,.5);return{q:"IQ has mean "+m+" and SD "+sd+". A patient scores "+x+". What is the z-score?",a:f((x-m)/sd,2),tol:.02,f:["z = (x − mean) ÷ SD"],p:"How many SDs the value sits from the mean. ±1.96 cuts off the outer 5%.",w:["x − mean = "+x+" − "+m+" = "+(x-m),"z = "+(x-m)+" ÷ "+sd+" = "+f((x-m)/sd,2)]}}],
["Cohen's d","d",function(){var a=R(10,20),b=a-R(2,8),sd=R(4,10);return{q:"Mean depression score after CBT "+b+", after waiting list "+a+". Pooled SD "+sd+". What is Cohen's d?",a:f((a-b)/sd,2),tol:.02,f:["d = (Mean₁ − Mean₂) ÷ pooled SD"],p:"The difference measured in SDs. 0.2 small, 0.5 medium, 0.8 large.",w:["Difference = "+a+" − "+b+" = "+(a-b),"d = "+(a-b)+" ÷ "+sd+" = "+f((a-b)/sd,2)]}}],
["ICER","ICER (£ per QALY)",function(){var cb=R(1000,5000,100),ca=cb+R(500,6000,100),qb=f(R(40,70)/100,2),qa=f(qb+R(5,20)/100,2);var v=(ca-cb)/(qa-qb);return{q:"Drug A costs £"+ca+" and gives "+qa+" QALYs. Drug B costs £"+cb+" and gives "+qb+" QALYs. What is the ICER (£ per QALY)?",a:Math.round(v),tol:Math.max(5,Math.round(v*.01)),f:["ICER = (Cost A − Cost B) ÷ (QALY A − QALY B)"],p:"The extra cost for each extra QALY. NICE threshold ≈ £25,000–£35,000.",w:["Δ cost = "+ca+" − "+cb+" = £"+(ca-cb),"Δ QALY = "+qa+" − "+qb+" = "+f(qa-qb,2),"ICER = "+(ca-cb)+" ÷ "+f(qa-qb,2)+" = £"+Math.round(v)]}}],
["Attributable risk","AR (%)",function(){var e=R(15,50),u=R(2,e-5);return{q:"Psychosis risk is "+e+"% in heavy cannabis users and "+u+"% in non-users. What is the attributable risk (%)?",a:e-u,tol:0,f:["AR = Risk exposed − Risk unexposed"],p:"The extra risk caused by the exposure.",w:["AR = "+e+"% − "+u+"% = "+(e-u)+"%"]}}],
["PAF","PAF (%)",function(){var u=R(5,15),t=u+R(2,10);return{q:"Incidence of depression is "+t+" per 1,000 in the whole population and "+u+" per 1,000 in the unexposed. What is the population attributable fraction (%)?",a:f((t-u)/t*100,1),tol:1,f:["PAF = (Incidence total − Incidence unexposed) ÷ Incidence total"],p:"The share of ALL cases in the population due to the exposure.",w:["Difference = "+t+" − "+u+" = "+(t-u),"PAF = "+(t-u)+" ÷ "+t+" = "+f((t-u)/t*100,1)+"%"]}}],
["Kappa","κ",function(){var po=R(70,95)/100,pe=R(40,65)/100;return{q:"Two psychiatrists agree on "+Math.round(po*100)+"% of diagnoses. Agreement expected by chance is "+Math.round(pe*100)+"%. What is kappa?",a:f((po-pe)/(1-pe),2),tol:.02,f:["κ = (Observed − Expected) ÷ (1 − Expected)"],p:"Agreement beyond chance. Above 0.8 very good, below 0.2 poor.",w:["Observed − Expected = "+po+" − "+pe+" = "+f(po-pe,2),"1 − Expected = "+f(1-pe,2),"κ = "+f(po-pe,2)+" ÷ "+f(1-pe,2)+" = "+f((po-pe)/(1-pe),2)]}}],
["Number to screen","People with the condition",function(){var s=R(50,95),t=R(50,400,10);return{q:"A screen has sensitivity "+s+"%. You need to detect "+t+" people with the condition. How many people WITH the condition must be screened?",a:Math.ceil(t/(s/100)-1e-9),tol:1,f:["Number = target ÷ sensitivity"],p:"Sensitivity only catches a share, so you need more than the target.",w:["Number = "+t+" ÷ "+(s/100)+" = "+f(t/(s/100),1)+" → "+Math.ceil(t/(s/100)-1e-9)]}}],
["Bonferroni","Adjusted α",function(){var k=R(2,10);return{q:"A study runs "+k+" separate comparisons at α = 0.05. What is the Bonferroni-adjusted significance level?",a:f(.05/k,4),tol:.0002,f:["Adjusted α = α ÷ number of comparisons"],p:"More tests → stricter cut-off, so chance findings are not called significant.",w:["0.05 ÷ "+k+" = "+f(.05/k,4)]}}]
];
var cur=-1,item,score=[0,0];
function list(){document.getElementById('list').innerHTML='<button data-i="-1">Mixed: all calculations <small>'+G.length+'</small></button>'+G.map(function(g,i){return '<button data-i="'+i+'">'+g[0]+'</button>'}).join('');
  [].forEach.call(document.querySelectorAll('#list button'),function(b){b.onclick=function(){cur=+b.dataset.i;[].forEach.call(document.querySelectorAll('#list button'),function(x){x.classList.toggle('on',x===b)});go()}});document.querySelector('#list button').classList.add('on')}
function go(){var i=cur<0?R(0,G.length-1):cur,g=G[i];item=g[2]();item.u=g[1];
  document.getElementById('where').textContent=(cur<0?'Mixed':'Topic')+' · '+g[0];document.getElementById('title').textContent=g[0];
  document.getElementById('q').textContent=item.q;var a=document.getElementById('ans');a.value='';a.placeholder=g[1];a.focus();document.getElementById('res').innerHTML=''}
function check(){var v=parseFloat(document.getElementById('ans').value.replace(/[£,%\s]/g,''));if(isNaN(v))return;
  var t=item.a,ok=Math.abs(v-t)<=item.tol+1e-9||(/%/.test(item.u)&&Math.abs(v*100-t)<=item.tol+1e-9);
  score[1]++;if(ok)score[0]++;document.getElementById('score').textContent=score[0]+' / '+score[1];
  document.getElementById('res').innerHTML='<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct':'Not quite')+' · answer '+t+'</div>'+
  '<div class="formula"><b>The formula</b>'+item.f.map(function(x){return '<div>'+x+'</div>'}).join('')+'<p class="plain">In simple words: '+item.p+'</p></div>'+
  '<div class="work"><span class="lab">The working</span><ol>'+item.w.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol></div>'}
document.getElementById('check').onclick=check;document.getElementById('next').onclick=go;
document.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();item&&document.getElementById('res').innerHTML?go():check()}else if((e.key==='n'||e.key==='N')&&e.target.tagName!=='INPUT')go()});
list();go();
